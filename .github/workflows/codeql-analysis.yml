name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '33 23 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build all workspace modules
        run: |
          for dir in $(go list -f '{{.Dir}}' -m | grep -v 'tools$'); do
            go -C "$dir" build ./...
          done

      - uses: github/codeql-action/analyze@v3
